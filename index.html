<!DOCTYPE html>
<html>

<head>

    <title>Emergency & Community Support</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Emergency & Community Support</h1>

    <button id="sosButton" onclick="sendSOS()">
        🚨 SOS EMERGENCY
    </button>

    <br><br>

    <button onclick="startVoiceSOS()">
        🎤 Voice SOS
    </button>

    <p id="message"></p>

    <script src="{{ url_for('static',
                     filename='script.js') }}">
    </script>

</body>

</html>





<h2>Book Caregiver</h2>

<select id="service">

    <option value="Nurse">
        Nurse
    </option>

    <option value="Physiotherapist">
        Physiotherapist
    </option>

    <option value="Home Care">
        Home Care
    </option>

</select>

<button onclick="bookCaregiver()">
    Book
</button>






<h2>Volunteer Registration</h2>

<input id="volunteerName"
       placeholder="Name">

<input id="volunteerPhone"
       placeholder="Phone">

<input id="volunteerService"
       placeholder="How can you help?">

<button onclick="registerVolunteer()">
    Register
</button>
